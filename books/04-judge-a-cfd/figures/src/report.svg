<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100">
  <rect width="1400" height="1100" fill="#ffffff"/>
  <text x="36" y="40" fill="#111" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">How to use the report. One decision. Read in this order.</text>
  <text x="36" y="72" fill="#333" font-family="DejaVu Sans, sans-serif" font-size="16">Write the decision before you look at the colors. A plot is not a pass.</text>

  <g font-family="DejaVu Sans, sans-serif" font-size="15" fill="#111">
    <rect x="36" y="96" width="1328" height="36" fill="#111"/>
    <text x="48" y="120" fill="#fff" font-weight="700">Section</text>
    <text x="250" y="120" fill="#fff" font-weight="700">Extract this</text>
    <text x="760" y="120" fill="#fff" font-weight="700">You may write</text>
    <text x="1080" y="120" fill="#fff" font-weight="700">You may not write</text>

    <g>
      <rect x="36" y="132" width="1328" height="110" fill="#f6f6f4" stroke="#111"/>
      <text x="48" y="164" font-weight="700">1. Purpose</text>
      <text x="250" y="164">The one sentence in the file.</text>
      <text x="250" y="190">If it is missing, write</text>
      <text x="250" y="214">“purpose not stated.”</text>
      <text x="760" y="164">Which of the four decisions</text>
      <text x="760" y="190">this file is for.</text>
      <text x="1080" y="164">A kinder sentence</text>
      <text x="1080" y="190">you invented.</text>
    </g>
    <g>
      <rect x="36" y="242" width="1328" height="120" fill="#fff" stroke="#111"/>
      <text x="48" y="274" font-weight="700">2. Scene</text>
      <text x="250" y="274">Whose heat. Which units</text>
      <text x="250" y="300">are on. Containment.</text>
      <text x="250" y="326">Setpoints in the model.</text>
      <text x="760" y="274">That this is one scene.</text>
      <text x="1080" y="274">A failure, a partial load,</text>
      <text x="1080" y="300">or another layout that</text>
      <text x="1080" y="326">was not run.</text>
    </g>
    <g>
      <rect x="36" y="362" width="1328" height="130" fill="#f6f6f4" stroke="#111"/>
      <text x="48" y="394" font-weight="700">3. IT block</text>
      <text x="250" y="394">For each named cabinet:</text>
      <text x="250" y="420">inlet, outlet, heat, airflow.</text>
      <text x="250" y="446">Not one room average.</text>
      <text x="760" y="394">Whether those cabinets</text>
      <text x="760" y="420">meet the comparison</text>
      <text x="760" y="446">you wrote first.</text>
      <text x="1080" y="394">That the liquid side</text>
      <text x="1080" y="420">passed. That is the</text>
      <text x="1080" y="446">third book’s sheet.</text>
    </g>
    <g>
      <rect x="36" y="492" width="1328" height="120" fill="#fff" stroke="#111"/>
      <text x="48" y="524" font-weight="700">4. Air-unit</text>
      <text x="48" y="548" font-weight="700">block</text>
      <text x="250" y="524">Per unit: supply average,</text>
      <text x="250" y="550">return average, flow</text>
      <text x="250" y="576">or pressure.</text>
      <text x="760" y="524">Whether the units match</text>
      <text x="760" y="550">the scene you signed.</text>
      <text x="1080" y="524">A flow rate traced</text>
      <text x="1080" y="550">off a streamline.</text>
    </g>
    <g>
      <rect x="36" y="612" width="1328" height="120" fill="#f6f6f4" stroke="#111"/>
      <text x="48" y="644" font-weight="700">5. Plots</text>
      <text x="250" y="644">Temperature and velocity.</text>
      <text x="250" y="670">The plane of the cut.</text>
      <text x="250" y="696">The units on the scale.</text>
      <text x="760" y="644">Where to walk next,</text>
      <text x="760" y="670">if a spot has a named input.</text>
      <text x="1080" y="644">“The hall passed”</text>
      <text x="1080" y="670">because the picture</text>
      <text x="1080" y="696">is mostly blue.</text>
    </g>
    <g>
      <rect x="36" y="732" width="1328" height="130" fill="#fff" stroke="#111"/>
      <text x="48" y="764" font-weight="700">6. Last</text>
      <text x="48" y="788" font-weight="700">pages</text>
      <text x="250" y="764">Each recommendation:</text>
      <text x="250" y="790">the input to change, and</text>
      <text x="250" y="816">whether a rerun is in the file.</text>
      <text x="760" y="764">A result, only if the rerun</text>
      <text x="760" y="790">is there and the scene</text>
      <text x="760" y="816">is otherwise the same.</text>
      <text x="1080" y="764">“Add cooling”</text>
      <text x="1080" y="790">with no second run.</text>
      <text x="1080" y="816">That is a proposal.</text>
    </g>
  </g>
  <text x="36" y="920" fill="#111" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Four decisions, pick one: design comparison, built hall, operating cause, change after a unit stops.</text>
  <text x="36" y="952" fill="#333" font-family="DejaVu Sans, sans-serif" font-size="16">Built hall requires the measurement record. Design does not. Failure is a different scene, not a caption.</text>
  <text x="36" y="984" fill="#333" font-family="DejaVu Sans, sans-serif" font-size="16">Comparison, written first: quantity, limit, document edition. The color bar is not the limit.</text>
  <text x="36" y="1048" fill="#111" font-family="DejaVu Sans, sans-serif" font-size="16">If a cell above is blank, the decision has not been made.</text>
</svg>
