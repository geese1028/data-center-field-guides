<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <rect width="1400" height="780" fill="#ffffff"/>
  <text x="48" y="42" fill="#1a1a1a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Fig. 4</text>
  <text x="110" y="42" fill="#444" font-family="DejaVu Sans, sans-serif" font-size="15">Section. The plot is a cut through this room, not a poster.</text>

  <!-- ceiling -->
  <line x1="80" y1="120" x2="900" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <text x="80" y="108" fill="#1a1a1a" font-family="DejaVu Sans, sans-serif" font-size="13">Ceiling return</text>
  <!-- floor -->
  <line x1="80" y1="620" x2="900" y2="620" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="80" y1="660" x2="900" y2="660" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="80" y="700" fill="#1a1a1a" font-family="DejaVu Sans, sans-serif" font-size="13">Raised floor, if the room has one</text>

  <!-- cold aisle -->
  <text x="120" y="380" fill="#1d4e89" font-family="DejaVu Sans, sans-serif" font-size="14">Cold aisle</text>
  <!-- rack -->
  <rect x="340" y="200" width="120" height="420" fill="#f7f7f5" stroke="#1a1a1a" stroke-width="2"/>
  <text x="358" y="230" fill="#1a1a1a" font-family="DejaVu Sans, sans-serif" font-size="13">Rack</text>
  <circle cx="352" cy="400" r="6" fill="#1d4e89"/>
  <text x="250" y="404" fill="#1d4e89" font-family="DejaVu Sans, sans-serif" font-size="13">Inlet</text>
  <circle cx="448" cy="400" r="6" fill="#b23a2f"/>
  <text x="470" y="404" fill="#b23a2f" font-family="DejaVu Sans, sans-serif" font-size="13">Outlet</text>
  <!-- hot aisle -->
  <text x="500" y="380" fill="#b23a2f" font-family="DejaVu Sans, sans-serif" font-size="14">Hot aisle</text>

  <!-- cut plane -->
  <line x1="80" y1="360" x2="900" y2="360" stroke="#e6a23c" stroke-width="1.2" stroke-dasharray="8 5"/>
  <text x="80" y="348" fill="#a87412" font-family="DejaVu Sans, sans-serif" font-size="13">Cut named on the plot. A calm cut is still a choice.</text>

  <!-- unit -->
  <rect x="760" y="200" width="100" height="420" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="776" y="230" fill="#1a1a1a" font-family="DejaVu Sans, sans-serif" font-size="13">Unit</text>

  <g font-family="DejaVu Sans, sans-serif" font-size="15" fill="#1a1a1a">
    <text x="960" y="220">The plot illustrates this cut.</text>
    <text x="960" y="260">It does not replace the</text>
    <text x="960" y="288">inlet and outlet numbers.</text>
    <text x="960" y="360" fill="#444">If the plane is not named,</text>
    <text x="960" y="388" fill="#444">set the plot aside.</text>
  </g>
</svg>
