<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <rect width="1400" height="860" fill="#ffffff"/>
  <text x="40" y="46" fill="#111" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700">Three papers. A permit sits on top. Do not invent a fourth name.</text>
  <g font-family="DejaVu Sans, sans-serif" font-size="16" fill="#111">
    <rect x="40" y="80" width="1320" height="36" fill="#111"/>
    <text x="52" y="104" fill="#fff" font-weight="700">Paper</text>
    <text x="280" y="104" fill="#fff" font-weight="700">Use it for</text>
    <text x="620" y="104" fill="#fff" font-weight="700">Must contain</text>
    <text x="1040" y="104" fill="#fff" font-weight="700">Stop if</text>
    <rect x="40" y="116" width="1320" height="140" fill="#f6f6f4" stroke="#111"/>
    <text x="52" y="150" font-weight="700">Standing</text>
    <text x="52" y="176">procedure</text>
    <text x="280" y="150">The same task, every time.</text>
    <text x="280" y="176">Round. Lamp test. Valve</text>
    <text x="280" y="202">where the last job left it.</text>
    <text x="620" y="150">Steps. Limit that stops</text>
    <text x="620" y="176">the task. Who may do it.</text>
    <text x="620" y="202">Found at the point of work.</text>
    <text x="1040" y="150">The only copy is a habit,</text>
    <text x="1040" y="176">or nobody can find it</text>
    <text x="1040" y="202">at the panel.</text>
    <rect x="40" y="256" width="1320" height="160" fill="#fff" stroke="#111"/>
    <text x="52" y="290" font-weight="700">Specific job</text>
    <text x="280" y="290">One job, one day.</text>
    <text x="280" y="316">Approved before tools.</text>
    <text x="620" y="290">What is isolated. What the</text>
    <text x="620" y="316">plant does meanwhile. How</text>
    <text x="620" y="342">you return. How you back out.</text>
    <text x="620" y="368">Service impact, including none.</text>
    <text x="1040" y="290">The paper is written during</text>
    <text x="1040" y="316">the job. That is a story.</text>
    <text x="1040" y="342">File it as a note. Do not</text>
    <text x="1040" y="368">backdate the method.</text>
    <rect x="40" y="416" width="1320" height="150" fill="#f6f6f4" stroke="#111"/>
    <text x="52" y="450" font-weight="700">Emergency</text>
    <text x="280" y="450">You cannot wait for the</text>
    <text x="280" y="476">job paper.</text>
    <text x="620" y="450">Stop. Call. First safe state.</text>
    <text x="620" y="476">Then stop. The repair is a</text>
    <text x="620" y="502">new job paper.</text>
    <text x="1040" y="450">The emergency paper is</text>
    <text x="1040" y="476">twenty pages of repair.</text>
    <text x="1040" y="502">Split it.</text>
    <rect x="40" y="566" width="1320" height="130" fill="#fff" stroke="#111"/>
    <text x="52" y="600" font-weight="700">Permit</text>
    <text x="280" y="600">This work, this place,</text>
    <text x="280" y="626">this time, these people.</text>
    <text x="620" y="600">Sits on top of the three.</text>
    <text x="620" y="626">Names the host if a vendor</text>
    <text x="620" y="652">is in the room.</text>
    <text x="1040" y="600">Expired. Extending it is a</text>
    <text x="1040" y="626">new decision, not a shrug</text>
    <text x="1040" y="652">by the person with the wrench.</text>
  </g>
  <text x="40" y="760" fill="#111" font-family="DejaVu Sans, sans-serif" font-size="16">Spare the job refuses to start without: present, or the job does not start.</text>
  <text x="40" y="796" fill="#333" font-family="DejaVu Sans, sans-serif" font-size="16">Do not paste a course handout or a standard annex into the procedure. Cite the title. Write your plant's steps.</text>
</svg>
