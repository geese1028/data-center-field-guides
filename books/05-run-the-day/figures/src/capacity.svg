<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <rect width="1400" height="640" fill="#ffffff"/>
  <text x="40" y="48" fill="#111" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700">Three capacity questions. Unknown is allowed. Pretending is not.</text>
  <g font-family="DejaVu Sans, sans-serif" font-size="17" fill="#111">
    <rect x="40" y="90" width="1320" height="36" fill="#111"/>
    <text x="52" y="114" fill="#fff" font-weight="700">Question</text>
    <text x="360" y="114" fill="#fff" font-weight="700">Answer from</text>
    <text x="860" y="114" fill="#fff" font-weight="700">Not from</text>
    <rect x="40" y="126" width="1320" height="110" fill="#f6f6f4" stroke="#111"/>
    <text x="52" y="168" font-weight="700">What did you sell?</text>
    <text x="360" y="160">The contract clause.</text>
    <text x="360" y="190">If the slide disagrees, operate</text>
    <text x="360" y="216">to the contract. Send the slide back.</text>
    <text x="860" y="168">Last year's brochure.</text>
    <rect x="40" y="236" width="1320" height="110" fill="#fff" stroke="#111"/>
    <text x="52" y="278" font-weight="700">What is used?</text>
    <text x="360" y="270">A measurement or allocation,</text>
    <text x="360" y="296">named and dated.</text>
    <text x="860" y="278">A feeling that the room</text>
    <text x="860" y="304">is busy. A busy week is</text>
    <text x="860" y="330">not a kilowatt.</text>
    <rect x="40" y="346" width="1320" height="120" fill="#f6f6f4" stroke="#111"/>
    <text x="52" y="388" font-weight="700">What does one</text>
    <text x="52" y="414">failure leave?</text>
    <text x="360" y="388">A study of this plant,</text>
    <text x="360" y="414">named and dated. Or unknown.</text>
    <text x="860" y="388">A study of a plant you</text>
    <text x="860" y="414">have since changed.</text>
    <text x="860" y="440">A picture. A nameplate.</text>
  </g>
  <text x="40" y="520" fill="#111" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">A request that exceeds sold, or exceeds what one failure still carries, waits.</text>
  <text x="40" y="554" fill="#333" font-family="DejaVu Sans, sans-serif" font-size="16">The shift does not accept it by energizing the circuit just to try.</text>
  <text x="40" y="596" fill="#333" font-family="DejaVu Sans, sans-serif" font-size="16">Do not print an efficiency ratio here and call it health. Cite the definition and the meter, or stay silent.</text>
</svg>
